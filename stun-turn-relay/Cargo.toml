[package]
name = "stun-turn-relay"
version = "0.1.0"
edition = "2021"
description = "Lightweight STUN/TURN relay server for an E2EE messenger"

[dependencies]
base64 = "0.22"
bytes = "1"
dashmap = "6"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
